name: 4. Gerador Blocos Live (FR → VPS1)

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'   # 6×/dia, offset 1h do EN
  workflow_dispatch:

jobs:
  gerar_blocos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3'

      - name: Install dependencies
        run: pip install google-genai google-api-python-client google-auth google-auth-oauthlib pytz edge-tts

      - name: Generate audio block
        env:
          GEMINI_KEY_LIVE_CONTENT_1_FR: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_1_FR }}
          GEMINI_KEY_LIVE_CONTENT_2_FR: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_2_FR }}
          YOUTUBE_TOKEN_FR: ${{ secrets.YOUTUBE_TOKEN_FR }}
        run: |
          mkdir -p blocos_fr
          python ao_vivo_fr/gerar_bloco_live_fr.py

      - name: Sync to VPS1
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_FR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p /root/ao_vivo_fr/blocos 2>/dev/null || true
          rsync -avz --timeout=60 \
            -e "ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no" \
            blocos_fr/ \
            root@80.241.213.27:/root/ao_vivo_fr/blocos/
          rm -f ~/.ssh/vps_key
