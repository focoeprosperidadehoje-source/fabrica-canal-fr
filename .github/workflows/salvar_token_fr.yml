name: Salvar Token FR

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Codigo OAuth (code= da barra de endereco). Deixe em branco se token ja existe no VPS.'
        required: false

jobs:
  salvar-token:
    name: Troca o codigo por token e salva no VPS1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH for VPS1
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_FR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trocar codigo por token (se necessario) e salvar no VPS1
        env:
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 \
            AUTH_CODE="$AUTH_CODE" "/root/venv_fr/bin/python3 -" << 'PYEOF'
          import os, sys, json, requests
          from pathlib import Path
          with open('/root/ao_vivo_fr/.env') as f:
              for line in f:
                  line = line.strip()
                  if '=' in line and not line.startswith('#'):
                      k, v = line.split('=', 1)
                      os.environ.setdefault(k, v)
          CLIENT_ID     = os.environ.get('YT_CLIENT_ID', '')
          CLIENT_SECRET = os.environ.get('YT_CLIENT_SECRET', '')
          AUTH_CODE     = os.environ.get('AUTH_CODE', '').strip()
          TOKEN_PATH    = Path('/root/ao_vivo_fr/youtube_token.json')
          if not CLIENT_ID or not CLIENT_SECRET:
              print("ERRO: credenciais ausentes no .env FR"); sys.exit(1)
          if TOKEN_PATH.exists() and not AUTH_CODE:
              print("Token ja existe no VPS1 — pulando troca de codigo")
              import json as _j
              t = _j.loads(TOKEN_PATH.read_text())
              print("refresh_token presente:", bool(t.get('refresh_token')))
          elif not AUTH_CODE:
              print("ERRO: AUTH_CODE nao recebido e token nao existe"); sys.exit(1)
          else:
              resp = requests.post('https://oauth2.googleapis.com/token', data={
                  'code': AUTH_CODE,
                  'client_id': CLIENT_ID,
                  'client_secret': CLIENT_SECRET,
                  'redirect_uri': 'http://localhost',
                  'grant_type': 'authorization_code',
              })
              if not resp.ok:
                  print("ERRO ao trocar token:", resp.text); sys.exit(1)
              t = resp.json()
              creds = {
                  "token": t.get("access_token", ""),
                  "refresh_token": t.get("refresh_token", ""),
                  "token_uri": "https://oauth2.googleapis.com/token",
                  "client_id": CLIENT_ID,
                  "client_secret": CLIENT_SECRET,
                  "scopes": ["https://www.googleapis.com/auth/youtube"],
                  "universe_domain": "googleapis.com",
                  "account": "",
                  "expiry": None,
              }
              TOKEN_PATH.write_text(json.dumps(creds))
              print("Token salvo em", TOKEN_PATH)
              print("refresh_token presente:", bool(t.get('refresh_token')))
          PYEOF

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
