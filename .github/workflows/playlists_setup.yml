name: 5. Playlists das Novenas (FR)
# rerun 2026-09-29 apos reset de cota

on:
  schedule:
    - cron: '37 7 * * *' # diario, apos reset da cota (07:00 UTC)
  push:
    paths:
      - '.github/workflows/playlists_setup.yml'
      - 'playlists_setup.py'
  workflow_dispatch:

jobs:
  playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3'
      - run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread google-genai pytz
      - env:
          CANAL: "FR"
          GOOGLE_CREDENTIALS_FR: ${{ secrets.GOOGLE_CREDENTIALS_FR }}
          YOUTUBE_TOKEN_FR: ${{ secrets.YOUTUBE_TOKEN_FR }}
        run: python playlists_setup.py
