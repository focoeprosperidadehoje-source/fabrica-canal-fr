name: Gerar URL OAuth FR

on:
  workflow_dispatch:

jobs:
  gerar-url:
    name: Gera URL de autorizacao OAuth para Canal FR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH for VPS1
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_FR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Escrever credenciais OAuth no .env FR
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 << 'ENDSSH'
          set -e
          CID=$(python3 -c "import json; d=json.load(open('/root/ao_vivo_es/youtube_token.json')); print(d.get('client_id',''))")
          CSE=$(python3 -c "import json; d=json.load(open('/root/ao_vivo_es/youtube_token.json')); print(d.get('client_secret',''))")
          if [ -z "$CID" ] || [ -z "$CSE" ]; then echo "ERRO: credenciais vazias"; exit 1; fi
          touch /root/ao_vivo_fr/.env
          grep -v "^YT_CLIENT_ID=\|^YT_CLIENT_SECRET=" /root/ao_vivo_fr/.env > /tmp/env_fr.tmp 2>/dev/null || true
          printf 'YT_CLIENT_ID=%s\nYT_CLIENT_SECRET=%s\n' "$CID" "$CSE" >> /tmp/env_fr.tmp
          cp /tmp/env_fr.tmp /root/ao_vivo_fr/.env
          echo "Credenciais escritas no .env FR"
          ENDSSH

      - name: Gerar URL OAuth sem PKCE
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 "/root/venv_fr/bin/python3 -" << 'PYEOF'
          import os, sys, urllib.parse, secrets
          with open('/root/ao_vivo_fr/.env') as f:
              for line in f:
                  line = line.strip()
                  if '=' in line and not line.startswith('#'):
                      k, v = line.split('=', 1)
                      os.environ.setdefault(k, v)
          CLIENT_ID = os.environ.get('YT_CLIENT_ID', '')
          if not CLIENT_ID:
              print("ERRO: YT_CLIENT_ID ausente"); sys.exit(1)
          state = secrets.token_urlsafe(16)
          with open('/root/ao_vivo_fr/.oauth_state', 'w') as f:
              f.write(state)
          params = {
              'client_id': CLIENT_ID,
              'redirect_uri': 'http://localhost',
              'response_type': 'code',
              'scope': 'https://www.googleapis.com/auth/youtube',
              'access_type': 'offline',
              'prompt': 'consent',
              'state': state,
          }
          url = 'https://accounts.google.com/o/oauth2/auth?' + urllib.parse.urlencode(params)
          print()
          print("=" * 60)
          print("CANAL FR - URL DE AUTORIZACAO OAUTH")
          print("=" * 60)
          print(url)
          print("=" * 60)
          print("1. Copie a URL e abra no navegador")
          print("2. Login: canalinteligenciadivinafrance@gmail.com")
          print("3. Autorize — browser vai para localhost e da erro (normal)")
          print("4. Copie o valor de 'code=...' da barra de endereco")
          print("5. Execute workflow 'Salvar Token FR' com esse codigo")
          print("=" * 60)
          PYEOF

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
