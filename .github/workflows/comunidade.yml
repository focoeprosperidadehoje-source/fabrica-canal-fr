name: 3. Comunidade (FR)

on:
  schedule:
    - cron: '30 11 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  responder_comentarios:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3'
      - run: pip install google-genai google-api-python-client google-auth-oauthlib
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_FR: ${{ secrets.GOOGLE_CREDENTIALS_FR }}
          YOUTUBE_TOKEN_FR: ${{ secrets.YOUTUBE_TOKEN_FR }}
        run: python comunidade.py
