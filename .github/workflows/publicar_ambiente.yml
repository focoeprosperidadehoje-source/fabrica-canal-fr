name: Publicar Vídeos Ambiente FR (unlisted -> public)

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GOOGLE_CREDENTIALS: ${ secrets.GOOGLE_CREDENTIALS }
      YOUTUBE_TOKEN_FR_JSON: ${ secrets.YOUTUBE_TOKEN_FR }
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread pytz
      - run: python publicar_ambiente.py
